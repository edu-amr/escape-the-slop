name: Reportar um problema
description: Algo não funciona como deveria no site.
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra...
        2. Clique em...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava
  - type: input
    id: ambiente
    attributes:
      label: Navegador e sistema
      placeholder: Chrome 130, macOS
